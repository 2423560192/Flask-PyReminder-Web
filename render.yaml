services:
  # Web服务配置
  - type: web
    name: pyreminder
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_config.py run:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true  # 自动生成随机密钥
      - key: FLASK_DEBUG
        value: false
      - key: PYTHONUNBUFFERED
        value: true
      - key: NOTIFICATION_TOKEN
        sync: false  # 允许手动设置
      - key: TIMEZONE
        value: "Asia/Shanghai"  # 使用中国时区
      - key: REDIS_URL
        sync: false  # 需要手动设置完整的Redis URL（使用rediss://前缀启用SSL）
      - key: REDIS_SSL
        value: "True"
      - key: ADMIN_USERNAME
        value: "admin"  # 默认管理员用户名
      - key: DATABASE_URL
        sync: false  # 需要手动设置数据库连接URL 